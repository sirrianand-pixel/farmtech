name: farmtech
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.4
  image_picker: ^1.0.4
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_messaging: ^16.0.3
  url_launcher: ^6.3.0
  geolocator: ^14.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
